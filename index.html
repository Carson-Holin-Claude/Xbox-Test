<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controller Test</title>
<style>
  :root {
    color-scheme: light;
    --bg: #E9EDF1; --surface: #F7F9FB; --ink: #18202A; --muted: #5B6673; --line: #C5CDD6;
    --shell: #D5DCE3; --shell-edge: #8E9AA7; --well: #B9C3CD; --cap: #5E6874;
    --hot: #E39B12; --ok: #2B7F4F; --bad: #B23F22;
    --a: #3E9B4A; --b: #CC4237; --x: #2E6BC9; --y: #C99312;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #11161C; --surface: #1A2129; --ink: #E4E9EE; --muted: #98A4B1; --line: #2E3945;
      --shell: #252E38; --shell-edge: #52606F; --well: #141A21; --cap: #7E8B99;
      --hot: #F2B43A; --ok: #5CC489; --bad: #F0795B;
      --a: #5CC46A; --b: #F0675B; --x: #5D93EB; --y: #EBBE45;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; font-size: 16px; line-height: 1.45; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 20px 40px; }
  h1 { font-size: 2.25rem; line-height: 1.1; margin: 0 0 6px; }
  .status { margin: 0 0 18px; font-size: 1.125rem; color: var(--muted); max-width: 80ch; }
  .status.good { color: var(--ok); } .status.bad { color: var(--bad); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 18px; }
  .card { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 16px 18px; transition: border-color 80ms linear; }
  .card.active { border-color: var(--hot); }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .head h2 { margin: 0; font-size: 1.5rem; }
  .live { font-size: 0.9375rem; font-weight: 700; color: var(--muted); }
  .live.yes { color: var(--ok); }
  .name { margin: 2px 0 6px; font-size: 0.8125rem; color: var(--muted); overflow-wrap: anywhere; }

  svg { width: 100%; height: auto; display: block; }
  .shell { fill: var(--shell); stroke: var(--shell-edge); stroke-width: 2; }
  .well { fill: var(--well); }
  .cap, .bump, .dpad, .small { fill: var(--cap); }
  .trig-bg { fill: var(--well); stroke: var(--shell-edge); stroke-width: 1.5; }
  .trig-fill { fill: var(--hot); }
  .on { fill: var(--hot) !important; }
  .na { opacity: 0.25; }
  .lbl { font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; pointer-events: none; }
  .lbl-light { font-size: 12px; fill: var(--muted); text-anchor: middle; }
  .face { stroke-width: 3; fill: var(--surface); }
  .face-l { font-size: 15px; font-weight: 700; text-anchor: middle; pointer-events: none; }
  .f0 { stroke: var(--a); } .f0.on { fill: var(--a) !important; }
  .f1 { stroke: var(--b); } .f1.on { fill: var(--b) !important; }
  .f2 { stroke: var(--x); } .f2.on { fill: var(--x) !important; }
  .f3 { stroke: var(--y); } .f3.on { fill: var(--y) !important; }
  .t0 { fill: var(--a); } .t1 { fill: var(--b); } .t2 { fill: var(--x); } .t3 { fill: var(--y); }
  .t-on { fill: #fff; }

  .rows { margin: 8px 0 10px; display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 12px; font-size: 0.9375rem; }
  .rows dt { color: var(--muted); }
  .rows dd { margin: 0; font-variant-numeric: tabular-nums; }
  .count { font-size: 1.25rem; font-weight: 700; margin: 4px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .chip.done { background: var(--ok); border-color: var(--ok); color: var(--surface); font-weight: 700; }

  .empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 12px; }
  .foot { margin-top: 18px; font-size: 0.875rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Controller test</h1>
  <p id="status" class="status">Press any button on each controller. The browser stays quiet until it sees a button press.</p>
  <div id="grid" class="grid"><div class="empty">No controllers detected yet</div></div>
  <p class="foot" id="foot"></p>
</div>

<template id="tpl">
  <div class="card">
    <div class="head"><h2 class="title">Player</h2><span class="live">No input yet</span></div>
    <p class="name"></p>
    <svg viewBox="0 0 600 400" role="img" aria-label="Live controller diagram">
      <rect class="trig-bg" x="125" y="8" width="100" height="30" rx="10"/>
      <rect class="trig-fill lt" x="125" y="8" width="0" height="30" rx="10"/>
      <text class="lbl" x="175" y="28">LT</text>
      <rect class="trig-bg" x="375" y="8" width="100" height="30" rx="10"/>
      <rect class="trig-fill rt" x="375" y="8" width="0" height="30" rx="10"/>
      <text class="lbl" x="425" y="28">RT</text>
      <rect data-b="4" class="bump" x="110" y="48" width="130" height="24" rx="12"/>
      <rect data-b="5" class="bump" x="360" y="48" width="130" height="24" rx="12"/>
      <path class="shell" d="M150 80 C200 65 400 65 450 80 C520 95 560 180 575 290 C585 350 545 385 505 360 C470 340 450 300 410 290 L190 290 C150 300 130 340 95 360 C55 385 15 350 25 290 C40 180 80 95 150 80 Z"/>
      <circle class="well" cx="170" cy="160" r="38"/>
      <g class="lcap"><circle data-b="10" class="cap" cx="170" cy="160" r="24"/></g>
      <rect class="dpad" x="223" y="228" width="24" height="24" style="fill:var(--well)"/>
      <rect data-b="12" class="dpad" x="223" y="204" width="24" height="24" rx="4"/>
      <rect data-b="13" class="dpad" x="223" y="252" width="24" height="24" rx="4"/>
      <rect data-b="14" class="dpad" x="199" y="228" width="24" height="24" rx="4"/>
      <rect data-b="15" class="dpad" x="247" y="228" width="24" height="24" rx="4"/>
      <circle data-b="16" class="small" cx="300" cy="106" r="15"/>
      <rect data-b="8" class="small" x="256" y="142" width="24" height="16" rx="8"/>
      <rect data-b="9" class="small" x="320" y="142" width="24" height="16" rx="8"/>
      <rect data-b="17" class="small" x="290" y="176" width="20" height="12" rx="6"/>
      <text class="lbl-light" x="268" y="176">View</text>
      <text class="lbl-light" x="332" y="176">Menu</text>
      <circle class="well" cx="370" cy="240" r="38"/>
      <g class="rcap"><circle data-b="11" class="cap" cx="370" cy="240" r="24"/></g>
      <circle data-b="3" class="face f3" cx="430" cy="124" r="17"/><text data-t="3" class="face-l t3" x="430" y="129">Y</text>
      <circle data-b="2" class="face f2" cx="393" cy="160" r="17"/><text data-t="2" class="face-l t2" x="393" y="165">X</text>
      <circle data-b="1" class="face f1" cx="467" cy="160" r="17"/><text data-t="1" class="face-l t1" x="467" y="165">B</text>
      <circle data-b="0" class="face f0" cx="430" cy="196" r="17"/><text data-t="0" class="face-l t0" x="430" y="201">A</text>
    </svg>
    <dl class="rows">
      <dt>Left stick</dt><dd class="ls">0.00, 0.00</dd>
      <dt>Right stick</dt><dd class="rs">0.00, 0.00</dd>
      <dt>Left trigger</dt><dd class="ltv">0%</dd>
      <dt>Right trigger</dt><dd class="rtv">0%</dd>
    </dl>
    <p class="count">0 of 18 confirmed</p>
    <div class="chips"></div>
  </div>
</template>

<script>
(function () {
  try { if ('gamepadInputEmulation' in navigator) navigator.gamepadInputEmulation = 'gamepad'; } catch (e) {}

  var NAMES = ['A','B','X','Y','LB','RB','LT','RT','View','Menu','L stick click','R stick click',
               'D-pad up','D-pad down','D-pad left','D-pad right','Left stick moved','Right stick moved'];
  var cards = {};
  var gridSig = '';
  var blocked = false;

  function readPads() {
    if (!navigator.getGamepads) return [];
    try { return Array.prototype.slice.call(navigator.getGamepads()).filter(Boolean); }
    catch (e) { blocked = true; return []; }
  }
  function isOn(b) { return !!b && (b.pressed || b.value > 0.5); }

  function makeCard(gp, playerNum) {
    var node = document.getElementById('tpl').content.firstElementChild.cloneNode(true);
    node.querySelector('.title').textContent = 'Player ' + playerNum;
    node.querySelector('.name').textContent = gp.id + '  (slot ' + gp.index + ')';
    var chips = node.querySelector('.chips');
    NAMES.forEach(function (n) {
      var c = document.createElement('span'); c.className = 'chip'; c.textContent = n; chips.appendChild(c);
    });
    return {
      el: node,
      btns: Array.prototype.slice.call(node.querySelectorAll('[data-b]')),
      texts: Array.prototype.slice.call(node.querySelectorAll('[data-t]')),
      chips: Array.prototype.slice.call(chips.children),
      lt: node.querySelector('.lt'), rt: node.querySelector('.rt'),
      lcap: node.querySelector('.lcap'), rcap: node.querySelector('.rcap'),
      ls: node.querySelector('.ls'), rs: node.querySelector('.rs'),
      ltv: node.querySelector('.ltv'), rtv: node.querySelector('.rtv'),
      count: node.querySelector('.count'), live: node.querySelector('.live'),
      confirmed: {}, everInput: false, lastActive: 0
    };
  }

  function rebuild(list) {
    var sig = list.map(function (p) { return p.index + ':' + p.id; }).join('|');
    if (sig === gridSig) return;
    gridSig = sig;
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    if (!list.length) { grid.innerHTML = '<div class="empty">No controllers detected yet</div>'; return; }
    var keep = {};
    list.forEach(function (gp, i) {
      var c = cards[gp.index];
      if (!c) c = makeCard(gp, i + 1);
      c.el.querySelector('.title').textContent = 'Player ' + (i + 1);
      keep[gp.index] = c;
      grid.appendChild(c.el);
    });
    cards = keep;
  }

  function draw(gp, c, now) {
    var any = false;
    c.btns.forEach(function (el) {
      var i = +el.getAttribute('data-b');
      var b = gp.buttons[i];
      var o = isOn(b);
      if (o && i < 16) any = true;
      el.classList.toggle('na', !b);
      el.classList.toggle('on', o);
    });
    c.texts.forEach(function (el) {
      el.classList.toggle('t-on', isOn(gp.buttons[+el.getAttribute('data-t')]));
    });
    var lt = gp.buttons[6] ? gp.buttons[6].value : 0;
    var rt = gp.buttons[7] ? gp.buttons[7].value : 0;
    c.lt.setAttribute('width', (100 * lt).toFixed(1));
    c.rt.setAttribute('width', (100 * rt).toFixed(1));
    var ax = function (i) { return gp.axes[i] || 0; };
    c.lcap.setAttribute('transform', 'translate(' + (ax(0) * 14).toFixed(1) + ' ' + (ax(1) * 14).toFixed(1) + ')');
    c.rcap.setAttribute('transform', 'translate(' + (ax(2) * 14).toFixed(1) + ' ' + (ax(3) * 14).toFixed(1) + ')');
    c.ls.textContent = ax(0).toFixed(2) + ', ' + ax(1).toFixed(2);
    c.rs.textContent = ax(2).toFixed(2) + ', ' + ax(3).toFixed(2);
    c.ltv.textContent = Math.round(lt * 100) + '%';
    c.rtv.textContent = Math.round(rt * 100) + '%';

    if (Math.hypot(ax(0), ax(1)) > 0.3 || Math.hypot(ax(2), ax(3)) > 0.3 || lt > 0.2 || rt > 0.2) any = true;
    if (any) { c.everInput = true; c.lastActive = now; }

    for (var j = 0; j < 16; j++) if (isOn(gp.buttons[j])) c.confirmed[j] = 1;
    if (Math.hypot(ax(0), ax(1)) > 0.9) c.confirmed[16] = 1;
    if (Math.hypot(ax(2), ax(3)) > 0.9) c.confirmed[17] = 1;
    var k = 0;
    c.chips.forEach(function (ch, i) { var d = !!c.confirmed[i]; if (d) k++; ch.classList.toggle('done', d); });
    c.count.textContent = k + ' of 18 confirmed';

    var activeNow = now - c.lastActive < 250;
    c.el.classList.toggle('active', activeNow);
    c.live.textContent = activeNow ? 'Input now' : (c.everInput ? 'Input received' : 'No input yet');
    c.live.classList.toggle('yes', c.everInput);
  }

  function setStatus(t, cls) {
    var s = document.getElementById('status');
    if (s.textContent !== t) s.textContent = t;
    s.className = 'status' + (cls ? ' ' + cls : '');
  }

  function loop(now) {
    var list = readPads();
    rebuild(list);
    var withInput = 0;
    list.forEach(function (gp) { var c = cards[gp.index]; if (c) { draw(gp, c, now); if (c.everInput) withInput++; } });

    if (blocked) setStatus('This window is blocking controller access. Open the page directly in Chrome or Edge.', 'bad');
    else if (!list.length) setStatus('Press any button on each controller. The browser stays quiet until it sees a button press.');
    else if (list.length === 1) setStatus('1 controller detected. Press a button on the second controller to add it.');
    else if (withInput === list.length) setStatus('All ' + list.length + ' controllers are sending input. Two player games will work here.', 'good');
    else setStatus(list.length + ' controllers detected, ' + withInput + ' sending input so far. Press buttons on each one. Its panel should outline and light up on its own.');

    document.getElementById('foot').textContent = 'Device: ' + (/Xbox/i.test(navigator.userAgent) ? 'Xbox console' : 'Not an Xbox') + '. Each panel outlines in color while that controller is in use.';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
